<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rsbot chat</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --surface: #fcfcfb; --panel: #ffffff; --line: #e6e5e0;
    --text: #1f1f1e; --muted: #6b6a63;
    --user-bg: #2a78d6; --user-text: #ffffff;
    --bot-bg: #f1f0ec; --bot-text: #1f1f1e;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19; --panel: #222220; --line: #34332f;
      --text: #f0efec; --muted: #a3a29a;
      --user-bg: #3987e5; --user-text: #ffffff;
      --bot-bg: #2c2c29; --bot-text: #f0efec;
      --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--surface); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; min-width: 200px; }
  header button {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  header button:hover { border-color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .log { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 4px; }
  .meta { align-self: flex-start; color: var(--muted); font-size: 12px; margin: -6px 0 2px 6px; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
    max-width: 792px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
    font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button {
    border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>rsbot</h1>
  <p>PyBot, the rule-based chatbot, ported exactly to Rust. No model, no weights: every reply comes from if-else rules, regexes and tables.</p>
  <button id="reset" type="button" title="Start a new conversation">New chat</button>
</header>
<main id="scroll"><div class="log" id="log"><p class="empty" id="empty">Say hello, ask for a recipe, or tell it about your day.</p></div></main>
<form id="form">
  <textarea id="text" rows="1" placeholder="Type a message" aria-label="Message" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log"), scroll = document.getElementById("scroll");
  const form = document.getElementById("form"), input = document.getElementById("text"), send = document.getElementById("send");
  let session = newId();

  function newId() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).slice(0, 36);
  }
  function add(cls, text) {
    document.getElementById("empty")?.remove();
    const el = document.createElement("div");
    el.className = cls; el.textContent = text;
    log.appendChild(el);
    scroll.scrollTop = scroll.scrollHeight;
    return el;
  }
  async function post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    return r.json();
  }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; input.style.height = "";
    add("msg user", text);
    send.disabled = true;
    try {
      const r = await post("/api/chat", { session, text });
      add("msg bot", r.reply);
      add("meta", `${r.module ?? "fallback"} · ${r.ms} ms`);
    } catch (err) {
      add("meta", "could not reach the bot: " + err.message);
    } finally {
      send.disabled = false; input.focus();
    }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
  document.getElementById("reset").addEventListener("click", () => {
    const old = session;
    session = newId();
    log.innerHTML = '<p class="empty" id="empty">New conversation. Say hello.</p>';
    input.focus();
    post("/api/reset", { session: old }).catch(() => {});  // the server forgets the old one
  });
</script>
</body>
</html>
