[package]
name = "rsbot"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.20.2"
flate2 = "1.1.11"
indexmap = { version = "2.14.2", features = ["serde"] }
pcre2 = "0.2.11"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

# Iteration builds for porting work: incremental, light optimisation, many codegen units.
# `cargo build --profile fast` -> target/fast/. The speed benchmark uses `release`.
[profile.fast]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256
debug = false

[profile.release]
lto = "thin"
